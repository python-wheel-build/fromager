name: Stale PRs

on:
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  stale:
    permissions:
      actions: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          # Pull requests only
          days-before-issue-stale: -1
          days-before-issue-close: -1

          # Stale after 2 weeks, closed after 4 weeks
          days-before-pr-stale: 14
          days-before-pr-close: 14

          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has had no activity for 2 weeks and is now marked as stale.

            To keep it active, push a commit or leave a comment. Activity removes the `stale` label and resets the timer.

            If it stays inactive for another 2 weeks, it will be closed. It can be reopened at any time.
          close-pr-message: |
            This pull request was closed because it stayed stale for 2 weeks after being marked stale.

            If it is still relevant, reopen it or open a new pull request that references this one.

          exempt-pr-labels: 'important,dependencies'
          exempt-draft-pr: true
          remove-stale-when-updated: true

          operations-per-run: 200
